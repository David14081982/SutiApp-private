name: Deploy SutiApp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Auth backend compatibility
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-auth-deployment-contract-live.js

      - name: Verify critical request backend compatibility
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-request-submission-deployment-contract-live.js

      - name: Build public artifact
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-pages-site.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const pause = () => new Promise(resolve => setTimeout(resolve, 5000));
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id: context.runId, name: 'github-pages' });
              const matches = data.artifacts.filter(item => item.name === 'github-pages' && !item.expired);
              if (matches.length > 1) throw new Error('Ambiguous Pages artifact');
              if (matches.length === 1) { artifact = matches[0]; break; }
              await pause();
            }
            if (!artifact || artifact.workflow_run?.id !== context.runId || artifact.workflow_run?.head_sha !== context.sha) throw new Error('Current Pages artifact unavailable');
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', { ...repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: oidcToken });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            const failed = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 120; attempt++) {
              await pause();
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', { ...repo, deployment_id: deploymentId });
              if (data.status === 'succeed') {
                if (!deployment.page_url) throw new Error('Pages URL missing');
                core.setOutput('page_url', deployment.page_url);
                core.info('Pages deployment succeeded');
                return;
              }
              if (failed.has(data.status)) throw new Error('Pages deployment failed: ' + data.status);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', { ...repo, deployment_id: deploymentId });
            throw new Error('Pages deployment timed out');

      - name: Verify critical request production deployment
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-request-submission-production-live.js "${{ steps.deployment.outputs.page_url }}"
