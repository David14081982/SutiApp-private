name: Deploy SutiApp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public artifact
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-pages-site.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
