name: Deploy SutiApp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Auth backend compatibility
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-auth-deployment-contract-live.js

      - name: Verify critical request backend compatibility
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-request-submission-deployment-contract-live.js

      - name: Build public artifact
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-pages-site.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async () => {
            const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`;
            for (let attempt = 0; attempt < 30; attempt++) {
              const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(10000) });
              if (!response.ok) throw new Error(`Artifact metadata HTTP ${response.status}`);
              const artifacts = (await response.json()).artifacts.filter(a => a.name === process.env.PAGES_ARTIFACT_NAME && !a.expired);
              if (artifacts.length === 1) { console.log('Pages artifact metadata ready'); return; }
              if (artifacts.length > 1) throw new Error('Duplicate Pages artifact');
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Pages artifact metadata unavailable after bounded wait');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Verify critical request production deployment
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-request-submission-production-live.js "${{ steps.deployment.outputs.page_url }}"
