name: Deploy SutiApp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Auth backend compatibility
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-auth-deployment-contract-live.js

      - name: Verify critical request backend compatibility
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-request-submission-deployment-contract-live.js

      - name: Build public artifact
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-pages-site.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = "1" ]; then
              echo "Pages artifact metadata is ready"
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/12)"
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available"
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify critical request production deployment
        env:
          SUTIAPP_SUPABASE_URL: ${{ secrets.SUTIAPP_SUPABASE_URL }}
          SUTIAPP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUTIAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/verify-request-submission-production-live.js "${{ steps.deployment.outputs.page_url }}"
