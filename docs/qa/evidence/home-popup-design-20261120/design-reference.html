<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pop-up de Inicio · SutiApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --guinda: #910022;
    --grad-guinda-soft: linear-gradient(145deg, #d11f3a, #910022);
    --glow-guinda: 0 10px 26px -6px rgba(209,31,58,.55), 0 4px 10px -2px rgba(145,0,34,.4);
    --ink: #14213d;
    --ink-2: #5a6378;
    --ink-3: #97a0b3;
    --surface: #ffffff;
    --bg: #f2f3f5;
    --hairline-strong: #d6dbe6;
    --neo-sm: 0 6px 16px -8px rgba(20,33,61,.16), 0 2px 5px rgba(20,33,61,.05);
    --font: 'Nunito', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font); color: var(--ink); background: #d9dee8; min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  button { font-family: var(--font); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--guinda); outline-offset: 2px; }
  svg { display: block; }

  /* Contenedor de la app (en tu app real, el pop-up va encima de la pantalla de Inicio) */
  .app { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
  @media (min-width: 760px) and (min-height: 640px) {
    body { background: #c9cfda; }
    .app { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 430px; height: min(932px, calc(100dvh - 48px)); border-radius: 30px; box-shadow: 0 40px 90px -30px rgba(20,33,61,.55); }
  }
  .reopen { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 46px; padding: 0 20px; border: none; border-radius: 14px; background: var(--surface); color: var(--guinda); font-size: 14.5px; font-weight: 800; box-shadow: var(--neo-sm); }

  /* ---------- Fondo oscuro ---------- */
  .pp-overlay {
    position: absolute; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 22px;
    background: rgba(16,12,14,0); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0);
    transition: background .26s ease, backdrop-filter .26s ease, -webkit-backdrop-filter .26s ease;
  }
  .pp-overlay.show { background: rgba(16,12,14,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

  /* ---------- Tarjeta ---------- */
  .pp-card {
    width: 100%; max-width: 340px; background: var(--surface); border-radius: 26px; overflow: hidden; position: relative;
    box-shadow: 0 30px 70px -20px rgba(16,12,14,.6);
    transform: translateY(24px) scale(.94); opacity: 0;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .26s ease;
  }
  .pp-overlay.show .pp-card { transform: translateY(0) scale(1); opacity: 1; }

  .pp-close {
    position: absolute; top: 12px; right: 12px; z-index: 4; width: 34px; height: 34px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.9); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: grid; place-items: center; color: var(--ink); box-shadow: 0 4px 12px -4px rgba(0,0,0,.3);
  }

  /* Imagen de cabecera */
  .pp-hero { position: relative; height: 184px; }
  .pp-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pp-tag {
    position: absolute; left: 16px; top: 16px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.92); color: var(--guinda); font-size: 10.5px; font-weight: 800; letter-spacing: .06em;
    padding: 6px 11px; border-radius: 999px; box-shadow: 0 4px 12px -4px rgba(0,0,0,.3);
  }

  /* Texto */
  .pp-body { padding: 20px 22px 8px; }
  .pp-sub { font-size: 12.5px; font-weight: 800; color: var(--guinda); letter-spacing: .02em; }
  .pp-title { font-size: 21px; font-weight: 800; color: var(--ink); margin: 4px 0 0; line-height: 1.15; letter-spacing: -.01em; }
  .pp-text { font-size: 13.5px; color: var(--ink-2); font-weight: 500; line-height: 1.5; margin: 10px 0 0; min-height: 44px; }

  /* Cambio de slide */
  .su-promo-next { animation: su-promo-next .32s cubic-bezier(.22,1,.36,1); }
  .su-promo-prev { animation: su-promo-prev .32s cubic-bezier(.22,1,.36,1); }
  @keyframes su-promo-next { from { transform: translateX(26px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes su-promo-prev { from { transform: translateX(-26px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Pie: navegación + botones */
  .pp-foot { padding: 0 22px 22px; }
  .pp-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  .pp-arrow { width: 38px; height: 38px; border-radius: 12px; border: none; background: var(--surface); box-shadow: var(--neo-sm); display: grid; place-items: center; color: var(--guinda); flex-shrink: 0; }
  .pp-dots { display: flex; gap: 7px; }
  .pp-dot { width: 8px; height: 8px; border-radius: 999px; border: none; padding: 0; background: var(--hairline-strong); transition: width .25s ease; }
  .pp-dot.on { width: 22px; background: var(--grad-guinda-soft); }

  .pp-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px; width: 100%; height: 50px; padding: 0 18px;
    border-radius: 15px; border: none; background: var(--grad-guinda-soft); color: #fff; box-shadow: var(--glow-guinda);
    font-size: 15.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
    transition: transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .2s;
  }
  .pp-cta:active { transform: scale(.975); }
  .pp-cta svg { transition: transform .18s cubic-bezier(.2,.7,.3,1); }
  .pp-cta:active svg { transform: translateX(2.5px); }
  .pp-later { display: block; width: 100%; margin-top: 12px; background: none; border: none; color: var(--ink-3); font-size: 13px; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .pp-overlay, .pp-card, .pp-dot { transition: none; }
    .su-promo-next, .su-promo-prev { animation: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <button class="reopen" id="reopen" hidden>Ver pop-up de nuevo</button>
</div>

<script>
(function () {
  // ===== Contenido de los pop-ups de Inicio (lo que se configura en el panel de administración) =====
  // actionType: 'internal' (abrir pantalla de la app) | 'url' (enlace externo) | 'none' (sin acción)
  // imagen: URL de la imagen de cabecera; si está vacía se usa un degradado con el tono "hue".
  var POPUPS = [
    {
      id: 'pp_bienvenida', etiqueta: 'BIENVENIDA', subtitulo: 'Tu súper app sindical',
      titulo: '¡Hola! Bienvenida a SutiApp',
      contenido: 'Consulta tu crédito, credencial digital, convenios y trámites en un solo lugar. Todo tu sindicato, en tu bolsillo.',
      imagen: '', hue: 345,
      ctaText: 'Explorar la app', actionType: 'internal', actionTarget: 'financiera'
    },
    {
      id: 'pp_unilider', etiqueta: 'CONVENIO DESTACADO', subtitulo: 'Unilíder',
      titulo: '50% de descuento en tu primera compra',
      contenido: 'Presenta tu credencial SUTISSSTESON en cualquier sucursal Unilíder y obtén 50% en tus mensualidades. Válido este mes.',
      imagen: '', hue: 205,
      ctaText: 'Ver convenio', actionType: 'internal', actionTarget: 'convenios'
    }
  ];

  // Qué hacer al tocar el botón principal con acción "internal" (conéctalo a tu navegación)
  function abrirPantalla(id) { console.log('Navegar a la pantalla:', id); }

  var AUTO_MS = 5200; // cambio automático entre pop-ups

  // ===== Iconos (mismo trazo que SutiApp) =====
  function ico(d, size, stroke) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + stroke + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  var IC = {
    close: '<path d="m6 6 12 12"/><path d="m18 6-12 12"/>',
    arrowL: '<path d="M20 12H5"/><path d="m11 6-6 6 6 6"/>',
    arrowR: '<path d="M4 12h15"/><path d="m13 6 6 6-6 6"/>',
    flame: '<path d="M12 3s4 3.5 4 8a4 4 0 0 1-8 0c0-1 .3-2 .8-2.6C8.5 9.5 8 11 7 11 5.5 11 5 9 5 12a7 7 0 0 0 14 0c0-5-3-7-7-9Z"/>'
  };
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var app = document.getElementById('app'), reopen = document.getElementById('reopen');
  var overlay, idx = 0, dir = 1, paused = false, timer = null;

  function slideHTML(p) {
    var hue = p.hue || 345;
    return '<div class="' + (dir > 0 ? 'su-promo-next' : 'su-promo-prev') + '">' +
      '<div class="pp-hero" style="background:linear-gradient(150deg, hsl(' + hue + ',70%,42%), hsl(' + hue + ',65%,26%))">' +
        (p.imagen ? '<img src="' + esc(p.imagen) + '" alt="" />' : '') +
        (p.etiqueta ? '<div class="pp-tag">' + ico(IC.flame, 13, 2.4) + esc(p.etiqueta) + '</div>' : '') +
      '</div>' +
      '<div class="pp-body">' +
        (p.subtitulo ? '<div class="pp-sub">' + esc(p.subtitulo) + '</div>' : '') +
        '<h3 class="pp-title" id="ppTitle">' + esc(p.titulo || 'Título del pop-up') + '</h3>' +
        (p.contenido ? '<p class="pp-text">' + esc(p.contenido) + '</p>' : '') +
      '</div></div>';
  }

  function footHTML(p) {
    var nav = '';
    if (POPUPS.length > 1) {
      nav = '<div class="pp-nav">' +
        '<button class="pp-arrow" data-go="-1" aria-label="Anterior">' + ico(IC.arrowL, 19, 2.2) + '</button>' +
        '<div class="pp-dots">' + POPUPS.map(function (_, i) {
          return '<button class="pp-dot' + (i === idx ? ' on' : '') + '" data-dot="' + i + '" aria-label="Pop-up ' + (i + 1) + '"></button>';
        }).join('') + '</div>' +
        '<button class="pp-arrow" data-go="1" aria-label="Siguiente">' + ico(IC.arrowR, 19, 2.2) + '</button>' +
      '</div>';
    }
    return nav +
      '<button class="pp-cta" data-cta>' + '<span>' + esc(p.ctaText || 'Continuar') + '</span>' + (p.actionType === 'none' ? '' : ico(IC.arrowR, 18.5, 2)) + '</button>' +
      '<button class="pp-later" data-close>Ahora no</button>';
  }

  function render() {
    var p = POPUPS[idx];
    overlay.querySelector('.pp-slide').innerHTML = slideHTML(p);
    overlay.querySelector('.pp-foot').innerHTML = footHTML(p);
    schedule();
  }
  function go(d) { dir = d; idx = (idx + d + POPUPS.length) % POPUPS.length; render(); }
  function schedule() {
    clearTimeout(timer);
    if (paused || POPUPS.length < 2) return;
    timer = setTimeout(function () { go(1); }, AUTO_MS);
  }

  function open() {
    if (!POPUPS.length) return;
    idx = 0; dir = 1; reopen.hidden = true;
    overlay = document.createElement('div');
    overlay.className = 'pp-overlay';
    overlay.innerHTML =
      '<div class="pp-card" role="dialog" aria-modal="true" aria-labelledby="ppTitle">' +
        '<button class="pp-close" data-close aria-label="Cerrar">' + ico(IC.close, 19, 2.4) + '</button>' +
        '<div class="pp-slide"></div>' +
        '<div class="pp-foot"></div>' +
      '</div>';
    app.appendChild(overlay);
    render();
    setTimeout(function () { overlay.classList.add('show'); overlay.querySelector('.pp-close').focus(); }, 30);

    var card = overlay.querySelector('.pp-card');
    card.addEventListener('mouseenter', function () { paused = true; clearTimeout(timer); });
    card.addEventListener('mouseleave', function () { paused = false; schedule(); });

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) return close();          // tocar fuera cierra
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-close')) close();
      else if (b.hasAttribute('data-go')) go(+b.getAttribute('data-go'));
      else if (b.hasAttribute('data-dot')) { var i = +b.getAttribute('data-dot'); dir = i > idx ? 1 : -1; idx = i; render(); }
      else if (b.hasAttribute('data-cta')) act();
    });
  }

  function act() {
    var p = POPUPS[idx];
    if (p.actionType === 'url' && p.actionTarget) window.open(p.actionTarget, '_blank', 'noopener');
    else if (p.actionType === 'internal' && p.actionTarget) abrirPantalla(p.actionTarget);
    close();
  }

  function close() {
    if (!overlay) return;
    clearTimeout(timer);
    overlay.classList.remove('show');
    var o = overlay; overlay = null;
    setTimeout(function () { o.remove(); reopen.hidden = false; }, 240);
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  reopen.addEventListener('click', open);
  open();
})();
</script>
</body>
</html>
